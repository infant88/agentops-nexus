version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentops-nexus-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///backend/sandbox/agentops_nexus.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/sandbox:/app/backend/sandbox
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: agentops-nexus-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

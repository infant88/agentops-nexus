name: AgentOps Nexus CI

on:
  push:
    branches: [main, feat/security-evaluation-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Unit Tests and Benchmark Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install the package in editable mode (and its declared dependencies)
          pip install -e .

          # Debug: verify whether langgraph is importable and where it comes from
          python - <<'PY2'
import importlib, sys, subprocess, traceback
try:
    m = importlib.import_module("langgraph")
    print("langgraph imported from:", getattr(m, "__file__", "<package>" ))
    print("langgraph members:", [x for x in dir(m) if not x.startswith("_")][:50])
except Exception as e:
    print("langgraph import failed:", e)
    traceback.print_exc()
    # Attempt to install langgraph explicitly from PyPI as a fallback
    print("Attempting pip install langgraph>=1.0.0")
    subprocess.check_call([sys.executable, "-m", "pip", "install", "langgraph>=1.0.0"])
    try:
        m = importlib.import_module("langgraph")
        print("langgraph imported after install from:", getattr(m, "__file__", "<package>" ))
    except Exception:
        print("Still cannot import langgraph after installing; aborting.")
        raise
PY2

      - name: Check Python imports
        run: python -c "import backend; print('Backend import OK')"

      - name: Run automated test suite
        run: python -m pytest -v

      - name: Run benchmark evaluation runner
        run: python -m backend.evaluation.runner

  security-and-lint:
    name: Security and Static Analysis Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Secret and security analysis
        run: |
          bandit -r backend/ -ll -ii || true

      - name: Lint and syntax checks
        run: |
          ruff check backend/ || true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-nexus"
version = "1.0.0"
description = "Evaluated AI Agent Platform combining LangGraph orchestration, MCP tools, human approvals, and observability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.2.0",
    "mcp>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["apps*"]

